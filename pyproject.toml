[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zhunt"
version = "0.1.0.dev0"
description = "Route LLM requests to the cheapest capable model."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["zhunt"]
