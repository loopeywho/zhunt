[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zhunt"
version = "0.2.0.dev0"
description = "Every AI model in one local workspace, free first: routes each prompt to the best available free-tier model and fails over automatically."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "fastapi==0.140.13",
    "httpx>=0.27,<1",
    "uvicorn>=0.30,<1",
    "PyYAML>=6.0,<7",
    "ruamel.yaml>=0.18,<1",
    "tomlkit>=0.13,<1",
    "typer>=0.16,<1",
    "cryptography>=42",  # offline licence verification (zhunt/licence.py)
    "websockets>=12,<16",  # agent browser: Chrome DevTools Protocol (zhunt/agent/browser.py)
]

[project.scripts]
zhunt = "zhunt.cli:app"

[project.optional-dependencies]
# Keep this for `pip install '.[dev]'`, which is what CI uses.
dev = [
    "pytest>=8.3,<9",
]

# PEP 735 dependency group: `uv sync` installs this by DEFAULT, so a fresh clone
# gets pytest inside the project environment and `uv run pytest` works. Without
# it, pytest is absent from the env, so uv falls back to running it in an
# isolated environment with no project deps - failing at collection with
# "ModuleNotFoundError: No module named 'tomlkit'" and 8 errors.
# Keep this in step with the `dev` extra above.
[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["thompson: keep the engine's production Thompson sampling in this test"]

[tool.hatch.build.targets.wheel]
packages = ["zhunt"]

