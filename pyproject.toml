[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zhunt"
version = "0.1.0.dev0"
description = "Route LLM requests to the cheapest capable model."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "litellm[proxy]==1.94.0",
    "fastapi==0.140.13",
    "PyYAML>=6.0,<7",
    "ruamel.yaml>=0.18,<1",
    "tomlkit>=0.13,<1",
    "typer>=0.16,<1",
]

[project.scripts]
zhunt = "zhunt.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["zhunt"]

[tool.hatch.build.targets.wheel.force-include]
"models.yaml" = "zhunt/models.yaml"
