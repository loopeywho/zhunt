[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "zhunt"
version = "0.2.0.dev0"
description = "Every AI model in one local workspace, free first: routes each prompt to the best available free-tier model and fails over automatically."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "fastapi==0.140.13",
    "httpx>=0.27,<1",
    "uvicorn>=0.30,<1",
    "PyYAML>=6.0,<7",
    "ruamel.yaml>=0.18,<1",
    "tomlkit>=0.13,<1",
    "typer>=0.16,<1",
    "cryptography>=42",  # offline licence verification (zhunt/licence.py)
    "websockets>=12,<16",  # agent browser: Chrome DevTools Protocol (zhunt/agent/browser.py)
]

[project.scripts]
zhunt = "zhunt.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = ["thompson: keep the engine's production Thompson sampling in this test"]

[tool.hatch.build.targets.wheel]
packages = ["zhunt"]

