name: Release checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install and test
        run: |
          python -m pip install '.[dev]'
          python -m pytest
      - name: Build wheel and verify clean installation
        run: |
          python -m pip wheel --no-deps --wheel-dir dist .
          python -m venv "$RUNNER_TEMP/zhunt-install"
          "$RUNNER_TEMP/zhunt-install/bin/python" -m pip install dist/zhunt-*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/zhunt-install/bin/zhunt" --help
          "$RUNNER_TEMP/zhunt-install/bin/python" "$GITHUB_WORKSPACE/scripts/smoke_install.py"
