version: 1
app: claude
name: Claude Code
format: json
root: mapping
target:
  default: .claude/settings.json
source: https://code.claude.com/docs/en/llm-gateway-connect
modes:
  api:
    operations:
      - action: merge
        path: [env]
        value:
          ANTHROPIC_BASE_URL: "{{ base_url }}"
          ANTHROPIC_AUTH_TOKEN: zhunt-local
  passthrough:
    supported: false
    message: >-
      Claude Code has one Anthropic base URL, so it cannot register Zhunt
      without routing all model traffic through it. Use --mode api.
