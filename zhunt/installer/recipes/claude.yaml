version: 1
app: claude
name: Claude Code
format: json
root: mapping
target:
  default: .claude/settings.json
source: https://code.claude.com/docs/en/llm-gateway-connect
modes:
  api:
    supported: false
    message: >-
      Claude Code sends provider model IDs that Zhunt cannot rewrite through its
      base URL alone, so API mode would silently bypass routing and provide no
      savings. Claude Code installation is unavailable until an explicit model
      alias integration is supported.
  passthrough:
    supported: false
    message: >-
      Claude Code sends provider model IDs that Zhunt cannot rewrite through its
      base URL alone, so passthrough mode cannot register a useful Zhunt provider.
