        speed: 99
        context_window: 64000
        supports_tools: true
        may_train_on_prompts: true


  # No key needed: Kilo Gateway serves its `:free` models to anonymous callers
  # (kilo.ai/docs/gateway/authentication; terms 5(C)(i) allow serving end users).
  # 200 requests/hour per IP, learned from 429s. Its free router may send prompts to
  # providers that log them and use them to improve their services, so it stays
  # behind the training gate. Checked with one anonymous call on 2026-10-11.
  # Named `:free` models added 2026-10-12 from Kilo's /models list, each answered one
  # anonymous call. NVIDIA's free endpoints log prompts to improve NVIDIA products
  # ("trial use only, no personal or confidential data"), so all stay may-train.
  # Left out: inkling-small (served from OpenRouter's shared pool, daily cap already
  # hit), guardrail/perception/tiny models, and openrouter/free.
  kilo:
    name: Kilo Gateway (no key needed)
    base_url: https://api.kilo.ai/api/gateway
    key_env: KILO_API_KEY
    litellm_provider: openai
    keyless: true
    key_url: https://app.kilo.ai
    free_note: "Works with no key at all. Its free models may log prompts and use them for training."
    verified_on: 2026-10-12
    models:
      - id: kilo-auto/free
        tiers: [chat, coding, reasoning]
        intelligence: 60
        speed: 55
        context_window: 128000
        supports_tools: true
        may_train_on_prompts: true
      - id: nvidia/nemotron-3-ultra-550b-a55b:free
        tiers: [chat, coding, reasoning, long-context]
        intelligence: 80
        speed: 40
        context_window: 1000000
        supports_tools: true
        may_train_on_prompts: true
      - id: nvidia/nemotron-3-super-120b-a12b:free
        tiers: [chat, coding, reasoning]
        intelligence: 72
        speed: 45
        context_window: 262144
        supports_tools: true
        may_train_on_prompts: true
      - id: poolside/laguna-s-2.1:free
        tiers: [coding]
        intelligence: 72
        speed: 70
        context_window: 262144
        supports_tools: true
        may_train_on_prompts: true
      - id: nvidia/nemotron-3.5-lightning:free
        tiers: [chat, long-context]
        intelligence: 50
        speed: 85
        context_window: 1000000
        supports_tools: true
        may_train_on_prompts: true

  # Z.ai (international Zhipu, Singapore): recurring free GLM Flash models, email
  # or Google sign-up (docs.z.ai/guides/overview/pricing, 2026-10-11). The pricing
  # page shows display names only; the API ids below are lowercased names and need a
  # live check. Its privacy policy names model training as a basis and points API
  # users to a separate DPA we could not find, so treated as may-train.
  zai:
    name: Z.ai (GLM)
    base_url: https://api.z.ai/api/paas/v4
    key_env: ZAI_API_KEY
    litellm_provider: openai
    key_url: https://z.ai/manage-apikey/apikey-list
    free_note: "Free GLM Flash models with an email sign-up; may use prompts for training."
    verified_on: 2026-10-11
    models:
      - id: glm-4.7-flash
        tiers: [chat, coding, reasoning]
        intelligence: 70
        speed: 60
        context_window: 128000
        supports_tools: true
        may_train_on_prompts: true
      - id: glm-4.5-flash
        tiers: [chat, coding]
        intelligence: 62
        speed: 65
        context_window: 128000
        supports_tools: true
        may_train_on_prompts: true

  # Mistral "Free mode": the default for new accounts, with included monthly usage
  # within limits shown per workspace on the console Limits page; no card
  # (docs.mistral.ai/admin/billing-usage/usage-limits and .../subscriptions,
  # 2026-10-12). Sign-up needs a verified phone number (one per account, per
  # third-party guides; Mistral's help article on it has moved). No caps published,
  # so none listed. Training: Mistral's help centre says Free-mode inputs and
  # outputs may be used to train its models unless the user opts out in the admin
  # Privacy settings. Ids are Mistral's `-latest` aliases (docs.mistral.ai/inference/
  # model-lifecycle); Small 4 and Medium 3.5 both list 256k context. Needs a live check.
  mistral:
    name: Mistral
    base_url: https://api.mistral.ai/v1
    key_env: MISTRAL_API_KEY
    litellm_provider: openai
    key_url: https://console.mistral.ai/api-keys
    free_note: "Free mode with a phone-verified account, no card; may train on prompts unless you opt out in Privacy settings."
    verified_on: 2026-10-12
    models:
      - id: mistral-small-latest
        tiers: [chat, coding, long-context]
        intelligence: 65
        speed: 75
        context_window: 256000
        supports_tools: true
        may_train_on_prompts: true
      - id: mistral-medium-latest
        tiers: [chat, coding, long-context, reasoning]
        intelligence: 78
        speed: 60
        context_window: 256000
        supports_tools: true
        may_train_on_prompts: true

  # SambaNova Cloud Free tier: applies while no payment method is linked
