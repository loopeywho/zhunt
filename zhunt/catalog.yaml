# Zhunt free-tier catalog.
#
# Everything here was read from each provider's own documentation on the
# `verified_on` date. Free tiers change often: re-check before relying on a row.
#
# - `limits` lists only caps the provider publishes for the free tier. A missing
#   cap means "not published", not "unlimited"; the engine learns the rest from
#   429 responses and cools the key down.
# - `intelligence` and `speed` are hand-assigned 1-100 rankings of these models
#   against each other. They are judgements, not benchmark results.
# - Tier assignments are likewise judgements about what each model is good for.
# - `may_train_on_prompts: true` means the provider says it may use prompts on
#   this tier, or we could not confirm that it does not. The privacy gate keeps
#   those models off unless the user opts in.
#
# `version` (UTC YYYYMMDDHHMM) is set by `scripts/catalog_tool.py publish`. A signed
# feed is used only when its version is newer than this one (zhunt/catalog_feed.py).

version: 202610100000

providers:
  groq:
    name: Groq
    key_url: https://console.groq.com/keys
    free_note: "Free tier, no card: fast open models (Llama, GPT-OSS, Qwen)."
    base_url: https://api.groq.com/openai/v1
    key_env: GROQ_API_KEY
    verified_on: 2026-10-10
    # Free-plan limits are not on Groq's public rate-limits page (it shows the
    # Developer plan), so none are listed.
    # Training: Groq docs say customer data is not retained for inference by
    # default (console.groq.com/docs/your-data).
    models:
      - id: llama-3.1-8b-instant
        tiers: [chat]
        intelligence: 25
        speed: 95
        context_window: 131072
        supports_tools: true
        may_train_on_prompts: false
      - id: openai/gpt-oss-20b
        tiers: [chat, coding]
        intelligence: 50
        speed: 90
        context_window: 131072
        supports_tools: true
        may_train_on_prompts: false
      - id: llama-3.3-70b-versatile
        tiers: [chat, coding]
        intelligence: 60
        speed: 80
        context_window: 131072
        supports_tools: true
        may_train_on_prompts: false
      - id: openai/gpt-oss-120b
        tiers: [chat, coding, reasoning]
        intelligence: 75
        speed: 70
        context_window: 131072
        supports_tools: true
        may_train_on_prompts: false
      - id: qwen/qwen3.8-27b  # preview
        tiers: [chat, coding]
        intelligence: 60
        speed: 70
        context_window: 131072
        supports_tools: true
        may_train_on_prompts: false
      - id: minimaxai/minimax-m2.7  # preview
        tiers: [coding, long-context]
        intelligence: 70
        speed: 60
        context_window: 196608
        supports_tools: true
        may_train_on_prompts: false

  google:
    name: Google AI Studio (Gemini API)
    key_url: https://aistudio.google.com/apikey
    free_note: "Free tier with a Google account; Google may use free-tier prompts to improve its products."
    litellm_provider: gemini
    base_url: https://generativelanguage.googleapis.com
    key_env: GEMINI_API_KEY
    verified_on: 2026-10-10
    # Google publishes no per-model free-tier numbers; they are shown per
    # project in AI Studio (aistudio.google.com/rate-limit), so none are listed.
    # Training: Google's pricing page says free-tier content is used to improve
    # Google products.
    models:
      - id: gemini-3.8-flash
        tiers: [chat, coding, long-context, reasoning]
        intelligence: 85
        speed: 70
        context_window: 1048576
        supports_tools: true
        may_train_on_prompts: true
      - id: gemini-3.6-flash
        tiers: [chat, coding, long-context]
        intelligence: 80
        speed: 75
        context_window: 1048576
        supports_tools: true
        may_train_on_prompts: true
      - id: gemini-3.5-flash-lite
        tiers: [chat, long-context]
        intelligence: 55
        speed: 90
        context_window: 1048576
        supports_tools: true
        may_train_on_prompts: true
      - id: gemini-3.1-flash-lite
        tiers: [chat, long-context]
        intelligence: 45
        speed: 92
        context_window: 1048576
        supports_tools: true
        may_train_on_prompts: true

  cerebras:
    name: Cerebras
    key_url: https://cloud.cerebras.ai
    free_note: "Free tier, no card: very fast GPT-OSS and Qwen; prompt use for training unconfirmed."
    base_url: https://api.cerebras.ai/v1
    key_env: CEREBRAS_API_KEY
    verified_on: 2026-10-10
    # Free-tier caps from inference-docs.cerebras.ai/support/rate-limits:
    # 5 requests/min, 30K uncached tokens/min (90K total), 1M tokens/day.
    # We apply the stricter 30K figure to every token. The page also lists
    # 1M tokens/hour, which the daily cap already covers.
    # Free-tier context is 65k (gpt-oss-120b) and 64k (qwen); we use 64000.
    # Training: no statement about API prompts found, so treated as possible.
    models:
      - id: gpt-oss-120b
        tiers: [chat, coding]
        limits: {rpm: 5, tpm: 30000, tpd: 1000000}
        intelligence: 75
        speed: 99
        context_window: 64000
        supports_tools: true
        may_train_on_prompts: true
      - id: qwen-3.8-27b
        tiers: [chat, coding]
        limits: {rpm: 5, tpm: 30000, tpd: 1000000}
        intelligence: 60
        speed: 99
        context_window: 64000
        supports_tools: true
        may_train_on_prompts: true


  # No key needed: Kilo Gateway serves its `:free` models to anonymous callers
  # (kilo.ai/docs/gateway/authentication; terms 5(C)(i) allow serving end users).
  # 200 requests/hour per IP, learned from 429s. Its free router may send prompts to
  # providers that log them and use them to improve their services, so it stays
  # behind the training gate. Checked with one anonymous call on 2026-10-11.
  kilo:
    name: Kilo Gateway (no key needed)
    base_url: https://api.kilo.ai/api/gateway
    key_env: KILO_API_KEY
    litellm_provider: openai
    keyless: true
    key_url: https://app.kilo.ai
    free_note: "Works with no key at all. Its free models may log prompts and use them for training."
    verified_on: 2026-10-11
    models:
      - id: kilo-auto/free
        tiers: [chat, coding, reasoning]
        intelligence: 60
        speed: 55
        context_window: 128000
        supports_tools: true
        may_train_on_prompts: true

  # Z.ai (international Zhipu, Singapore): recurring free GLM Flash models, email
  # or Google sign-up (docs.z.ai/guides/overview/pricing, 2026-10-11). The pricing
  # page shows display names only; the API ids below are lowercased names and need a
  # live check. Its privacy policy names model training as a basis and points API
  # users to a separate DPA we could not find, so treated as may-train.
  zai:
    name: Z.ai (GLM)
    base_url: https://api.z.ai/api/paas/v4
    key_env: ZAI_API_KEY
    litellm_provider: openai
    key_url: https://z.ai/manage-apikey/apikey-list
    free_note: "Free GLM Flash models with an email sign-up; may use prompts for training."
    verified_on: 2026-10-11
    models:
      - id: glm-4.7-flash
        tiers: [chat, coding, reasoning]
        intelligence: 70
        speed: 60
        context_window: 128000
        supports_tools: true
        may_train_on_prompts: true
      - id: glm-4.5-flash
        tiers: [chat, coding]
        intelligence: 62
        speed: 65
        context_window: 128000
        supports_tools: true
        may_train_on_prompts: true

  # Premium models for zhunt Pro's fallback, called directly with the user's own
  # paid key for each company (each provider is optional). Used only after every
  # free model is busy, only with Pro and `zhunt premium on`, under a monthly cap.
  # Prices: USD per token, list prices on 2026-10-11 (cross-checked against
  # openrouter.ai/api/v1/models, which passes provider prices through).
  # Model ids follow each company's API naming; the live check confirms them.
  # Training: all three state that paid API traffic is not used to train models
  # by default (Anthropic commercial terms, OpenAI API data controls, Google
  # Gemini API paid-services terms).
  anthropic:
    name: Anthropic (premium)
    key_url: https://console.anthropic.com/settings/keys
    free_note: "Paid (Pro): Claude, billed by Anthropic to your account."
    base_url: https://api.anthropic.com
    key_env: ANTHROPIC_API_KEY
    verified_on: 2026-10-11
    models:
      - id: claude-haiku-5-5
        tiers: [chat, coding]
        intelligence: 78
        speed: 85
        context_window: 1000000
        supports_tools: true
        may_train_on_prompts: false
        in: 0.0000001
        out: 0.0000005
      - id: claude-sonnet-5-5
        tiers: [chat, coding, long-context, reasoning]
        intelligence: 96
        speed: 60
        context_window: 1000000
        supports_tools: true
        may_train_on_prompts: false
        in: 0.000002
        out: 0.00001
  openai:
    name: OpenAI (premium)
    key_url: https://platform.openai.com/api-keys
    free_note: "Paid (Pro): GPT models, billed by OpenAI to your account."
    base_url: https://api.openai.com/v1
    key_env: OPENAI_API_KEY
    verified_on: 2026-10-11
    models:
      - id: gpt-5.6-luna
        tiers: [chat, coding]
        intelligence: 76
        speed: 85
        context_window: 1050000
        supports_tools: true
        may_train_on_prompts: false
        in: 0.0000002
        out: 0.0000012
      - id: gpt-5.6-sol
        tiers: [chat, coding, long-context, reasoning]
        intelligence: 96
        speed: 60
        context_window: 1050000
        supports_tools: true
        may_train_on_prompts: false
        in: 0.000002
        out: 0.00001
  google-paid:
    name: Google Gemini (premium)
    key_url: https://aistudio.google.com/apikey
    free_note: "Paid (Pro): a key from a Google Cloud project with billing turned on."
    base_url: https://generativelanguage.googleapis.com
    # A key from a Google Cloud project with billing turned on. Kept apart from
    # the free GEMINI_API_KEY so free-tier prompts and paid usage never mix.
    key_env: GEMINI_PAID_API_KEY
    litellm_provider: gemini
    verified_on: 2026-10-11
    models:
      - id: gemini-3.8-flash
        tiers: [chat, coding, long-context]
        intelligence: 85
        speed: 85
        context_window: 1048576
        supports_tools: true
        may_train_on_prompts: false
        in: 0.00000075
        out: 0.00000375
